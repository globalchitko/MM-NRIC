<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRC Data Checker & Validator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --primary: #2563eb;
            --badge-bg: #800000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 40px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .header h2 {
            font-size: 1.75rem;
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .required-star {
            color: #dc2626;
            margin-left: 4px;
        }

        /* NRIC Segment Row Styling matching image */
        .nrc-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nrc-select, .nrc-input {
            padding: 12px 14px;
            font-size: 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .nrc-select:focus, .nrc-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Specific input width sizing */
        #nrc_state {
            width: 90px;
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }

        #nrc_township {
            flex: 1;
            min-width: 160px;
            background-color: #ffffff;
        }

        #nrc_type {
            width: 95px;
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }

        #nrc_number {
            width: 135px;
            background-color: #fef9c3;
            border-color: #fde047;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Red Burmese Location Badge matching your visual layout */
        .nrc-preview-badge {
            display: none;
            margin-top: 10px;
            padding: 6px 14px;
            background-color: var(--badge-bg);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            width: fit-content;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px -1px rgba(128, 0, 0, 0.2);
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            display: none;
        }

        .info-card h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .info-item span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .info-item strong {
            font-size: 0.95rem;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>NRC Verification Checker</h2>
            <p>Interactive National Registration Identity Card validator with live Burmese translation preview.</p>
        </div>

        <div class="form-group">
            <label>National Registration Identity Card (NRIC) <span class="required-star">*</span></label>
            
            <div class="nrc-container">
                <!-- State Selection -->
                <select id="nrc_state" class="nrc-select">
                    <option value="">State</option>
                    <script>
                        for(let i=1; i<=14; i++) {
                            document.write(`<option value="${i}/">${i}/</option>`);
                        }
                    </script>
                </select>

                <!-- Township Input with Datalist -->
                <input type="text" id="nrc_township" class="nrc-input" placeholder="Township Code (e.g. MAM)" list="township-list">
                <datalist id="township-list"></datalist>

                <!-- Card Type Selection -->
                <select id="nrc_type" class="nrc-select">
                    <option value="(C)">(C)</option>
                    <option value="(N)" selected>(N)</option>
                    <option value="(P)">(P)</option>
                    <option value="(E)">(E)</option>
                </select>

                <!-- 6-Digit Serial Number -->
                <input type="text" id="nrc_number" class="nrc-input" placeholder="6-Digits" maxlength="6">
            </div>

            <!-- Burmese District/Township Live Badge -->
            <div id="nrc_preview_badge" class="nrc-preview-badge"></div>
        </div>

        <!-- Detailed Breakdown Result Card -->
        <div class="info-card" id="infoCard">
            <h4>Parsed Location Data</h4>
            <div class="info-grid">
                <div class="info-item">
                    <span>State / Region:</span>
                    <strong id="resState">-</strong>
                </div>
                <div class="info-item">
                    <span>District Name:</span>
                    <strong id="resDistrict">-</strong>
                </div>
                <div class="info-item">

                </div>
                <div class="info-item">
                    <span>Full Formatted NRIC:</span>
                    <strong id="resFull">-</strong>
                </div>
            </div>
        </div>
    </div>

        const stateSelect   = document.getElementById('nrc_state');
        const townshipInput = document.getElementById('nrc_township');
        const townshipList  = document.getElementById('township-list');
        const typeSelect    = document.getElementById('nrc_type');
        const numberInput   = document.getElementById('nrc_number');

        const badgePreview  = document.getElementById('nrc_preview_badge');
        const infoCard      = document.getElementById('infoCard');
        const resState      = document.getElementById('resState');
        const resDistrict   = document.getElementById('resDistrict');
        const resTownship   = document.getElementById('resTownship');
        const resFull       = document.getElementById('resFull');

        // Populate datalist options when state is changed
        stateSelect.addEventListener('change', function() {
            const selectedState = this.value;
            townshipList.innerHTML = '';
            townshipInput.value = '';

            if (nrcTownshipsData[selectedState]) {
                nrcTownshipsData[selectedState].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.code;
                    opt.label = `${item.code} (${item.district} - ${item.township})`;
                    townshipList.appendChild(opt);
                });
            }
            updateValidationPreview();
        });

        townshipInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
            updateValidationPreview();
        });

        typeSelect.addEventListener('change', updateValidationPreview);
        numberInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            updateValidationPreview();
        });

        function updateValidationPreview() {
            const state = stateSelect.value;
            const tCode = townshipInput.value.trim().toUpperCase();
            const type  = typeSelect.value;
            const num   = numberInput.value.trim();

            let stateMM = stateNamesMM[state] || '';
            let districtMM = '';
            let townshipMM = '';

            if (state && nrcTownshipsData[state]) {
                const found = nrcTownshipsData[state].find(item => item.code === tCode);
                if (found) {
                    districtMM = found.district;
                    townshipMM = found.township;
                }
            }

            if (stateMM || townshipMM) {
                let parts = [];
                if (stateMM) parts.push(stateMM);
                if (districtMM) parts.push(districtMM);
                if (townshipMM) parts.push(townshipMM);

                badgePreview.textContent = parts.join(' - ');
                badgePreview.style.display = 'inline-block';

                resState.textContent = stateMM || '-';
                resDistrict.textContent = districtMM || 'Custom / Unmatched';
                resTownship.textContent = townshipMM || tCode || '-';
                resFull.textContent = `${state} ${tCode} ${type} ${num}`;
                infoCard.style.display = 'block';
            } else {
                badgePreview.style.display = 'none';
                badgePreview.textContent = '';
                infoCard.style.display = 'none';
            }
        }
    </script>
